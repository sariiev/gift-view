[build-system]
requires = ["setuptools >= 80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "gift-view"
version = "0.1.0"
requires-python = ">= 3.12.10"
description = "Telegram Gifts Analytics Platform"
readme = "README.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]